name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint-changed-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Collect changed Python files
        id: changed
        shell: bash
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          HEAD_REF="${{ github.sha }}"
          mapfile -t FILES < <(git diff --name-only "$BASE_REF" "$HEAD_REF" -- '*.py' ':!**/migrations/*.py')

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "has_files=true"
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Ruff on changed Python files
        if: steps.changed.outputs.has_files == 'true'
        shell: bash
        run: |
          printf '%s\n' "${{ steps.changed.outputs.files }}" > changed-python-files.txt
          mapfile -t FILES < changed-python-files.txt
          ruff check "${FILES[@]}"

      - name: Run Black check on changed Python files
        if: steps.changed.outputs.has_files == 'true'
        shell: bash
        run: |
          printf '%s\n' "${{ steps.changed.outputs.files }}" > changed-python-files.txt
          mapfile -t FILES < changed-python-files.txt
          black --check --target-version py312 "${FILES[@]}"
