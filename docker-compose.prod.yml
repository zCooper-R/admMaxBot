services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: ["sh", "/app/docker/entrypoint.sh"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      MAXBOT_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_TO_FILES: "true"
      LOG_DIR: /var/log/maxbot
      DEBUG: "False"
      WAIT_FOR_DB: "true"
      DB_WAIT_MAX_ATTEMPTS: "30"
      DB_WAIT_INTERVAL_SECONDS: "2"
      RUN_DB_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "true"
      BACKUP_DIR: /app/backups
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WEB_APP_HOST:-127.0.0.1}:${WEB_APP_PORT:-8000}:8000"
    volumes:
      - static_data:/app/staticfiles
      - logs_data:/var/log/maxbot
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': os.getenv('DOMAIN', 'localhost'), 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_worker:
    build: .
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      MAXBOT_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEBUG: "False"
      LOG_TO_FILES: "true"
      LOG_DIR: /var/log/maxbot
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      BACKUP_DIR: /app/backups
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - logs_data:/var/log/maxbot
      - backup_data:/app/backups
    restart: unless-stopped

  celery_beat:
    build: .
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      MAXBOT_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEBUG: "False"
      LOG_TO_FILES: "true"
      LOG_DIR: /var/log/maxbot
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      BACKUP_DIR: /app/backups
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - logs_data:/var/log/maxbot
    restart: unless-stopped

  migrate:
    build: .
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py sync_periodic_tasks"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      MAXBOT_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEBUG: "False"
      BACKUP_DIR: /app/backups
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pg_data:
  redis_data:
  static_data:
  logs_data:
  backup_data:
